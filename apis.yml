aid: xfuel
name: XFuel
description: XFuel develops, patents, and deploys technologies that transform diverse
  waste into low-carbon drop-in transport fuels, using its Chemical Liquid Refining
  (CLR) and Mechanical Carbon Conversion (MECC) processes to produce marine (ISO
  8217 DMA), road (EN590), and in-development sustainable aviation fuels. Headquartered
  in Dublin, Ireland, with operations in Bunyola, Spain, and backed by Union Square
  Ventures. XFuel publishes no public API or developer program as of 2026-07-21.
